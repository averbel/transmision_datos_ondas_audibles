# Publica la web de SpaceWases (SpacesWases/web) en GitHub Pages.
# Solo se ejecuta a mano (Actions > Publicar web > Run workflow) y requiere activar
# antes Pages con la fuente "GitHub Actions". Ver SpacesWases/README.md, seccion Publicar.
name: Publicar web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node SpacesWases/web/test/roundtrip.mjs
      - run: node SpacesWases/web/test/stream.mjs

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copiar solo los archivos de la web
        run: |
          mkdir _site
          cp SpacesWases/web/index.html SpacesWases/web/app.js SpacesWases/web/spacewases.js SpacesWases/web/style.css SpacesWases/web/captura.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
